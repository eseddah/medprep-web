version: "3.8"
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]

  api:
    build: ./backend
    ports: ["5000:5000"]
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongo:27017/medprep
    env_file: ./backend/.env
    depends_on: [mongo]
    volumes: [./backend:/app, /app/node_modules]

  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    env_file: ./frontend/.env.local
    depends_on: [api]

volumes:
  mongo_data:
